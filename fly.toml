# Fly.io config. First deploy: see docs/DEPLOY.md.
# Pick your own app name (must be unique on Fly) and region.
app = "trash-talk-live"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

# One persistent disk for the JSON data files.
[mounts]
  source = "ttl_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Live rooms and data live in this one process, so run exactly one machine
  # and keep it awake (stopping it would drop everyone's live room).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 4000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
